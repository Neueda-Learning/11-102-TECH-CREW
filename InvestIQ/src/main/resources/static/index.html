<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InvestIQ Dashboard</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>
<header>
    <h1>InvestIQ</h1>
    <nav>
            <a href="index.html" class="active">Dashboard</a>
            <a href="portfolio.html">Portfolio</a>
            <a href="investment.html">Investments</a>
            <a href="performance.html">Performance</a>

    </nav>
</header>
<section class="Dashboard">
    <div class="card">
        <h3> Total Investment</h3>
        <h2 id="investmentValue">₹0.00</h2>
    </div>

    <div class="card">
        <h3> Current Value</h3>
        <h2 id="currentValue">₹0.00</h2>
    </div>

    <div class="card">
        <h3> Profit/Loss</h3>
        <h2 id="profitValue">₹0.00</h2>
    </div>

    <div class="card">
        <h3>Total Assets</h3>
        <h2 id="totalAssets">0.00</h2>
    </div>


</section>

<!--<section class="quick-actions">-->
<!--    <button onclick="location.href='portfolio.html'">Browse Portfolio</button>-->
<!--    <button onclick="location.href='investment.html'">Buy / Sell Assets</button>-->
<!--    <button onclick="location.href='performance.html'">View Performance</button>-->
<!--</section>-->

<section class="summary">
    <h2>Portfolio Summary</h2>
    <table>
        <thead>
            <tr>
                <th>Symbol</th>
                <th>Quantity</th>
                <th>Buy Price</th>
                <th>Current Price</th>
                <th>Profit</th>
            </tr>
        </thead>
        <tbody id="portfolioBody">
            <!-- Portfolio summary will be populated here -->
        </tbody>
    </table>

</section>
    <div class="chart-container">
        <h2>Portfolio Allocation</h2>
        <canvas id="allocationChart"></canvas>
    </div>
<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="js/dashboard.js"></script>
</body>
</html>
